name: Upload Voice Pack to Waze

on:
  workflow_dispatch:
    inputs:
      pack_name:
        description: 'Voice pack name'
        required: false
        default: 'BeepOnly'
      events_json:
        description: 'JSON map of event name -> silent/beep1/beep2'
        required: false

permissions:
  contents: write

concurrency:
  group: upload-voicepack
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r upload/requirements.txt

      - name: Write beep config from inputs
        if: ${{ inputs.events_json != '' }}
        env:
          PACK_NAME: ${{ inputs.pack_name }}
          EVENTS_JSON: ${{ inputs.events_json }}
        run: |
          python -c "
          import json, os
          events = json.loads(os.environ['EVENTS_JSON'])
          events = {k: v for k, v in events.items() if isinstance(k, str) and k.replace('_','').isalnum()}
          config = {'pack_name': os.environ.get('PACK_NAME') or 'BeepOnly', 'events': events}
          with open('upload/beep_config.json', 'w') as f:
              json.dump(config, f)
          "

      - name: Generate and upload voice pack
        run: python upload/generate_and_upload.py upload/beep_config.json

      - name: Show install link
        run: |
          echo "## 📱 Waze Install Link" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Open this link on your phone:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat waze_link.txt >> $GITHUB_STEP_SUMMARY

      - name: Commit waze_link.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add waze_link.txt
          git commit -m "chore: update waze install link [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "Push failed, retrying ($i)..."
            sleep 5
          done
          exit 1
